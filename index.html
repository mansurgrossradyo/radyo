<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mansur Gross Radyo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:url("bg.jpg") center/cover no-repeat fixed;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  color:#fff;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:-1;
}

/* ANA CAM */
#overlay{
  width:95%;
  max-width:1000px;
  margin-bottom:30px;
  background:rgba(20,20,20,.55);
  backdrop-filter:blur(18px);
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}

/* ÜST */
.topBar{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:6px;
  margin-bottom:20px;
}

#baslik{
  font-size:26px;
  font-weight:600;
}

#canli{
  font-size:14px;
  color:#28ff63;
  font-weight:bold;
}

/* KONTROL */
.mainCard{
  background:rgba(255,255,255,.05);
  padding:20px;
  border-radius:20px;
  margin-bottom:20px;
}

.controlRow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:14px;
  padding:14px 24px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#play{background:#ffc107;color:#111;}
#pause{background:#ff3d4f;color:#fff;}

#volumeBox{
  display:flex;
  align-items:center;
  gap:8px;
}

#volume{
  width:180px;
}

/* SAAT + HAVA */
#rightWidgets{
  margin-left:auto;
  display:flex;
  gap:14px;
}

#weatherBox{
  padding:12px;
  border-radius:16px;
  background:linear-gradient(135deg,#182848,#4b6cb7);
  text-align:center;
}

#weatherTemp{
  font-size:24px;
  font-weight:bold;
}

#clockBox{
  background:#fff;
  color:#111;
  padding:12px;
  border-radius:16px;
  text-align:center;
}

#clockTime{
  font-size:30px;
  font-weight:bold;
}

/* ŞARKI */
.songRow{
  margin-top:18px;
}

#durum{
  font-size:26px;
  font-weight:600;
}

#siradaki{
  font-size:14px;
  opacity:.6;
  margin-top:4px;
}

/* İSTEK */
#istekBolum{
  margin-top:18px;
  background:rgba(255,255,255,.05);
  padding:14px;
  border-radius:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

#istekBolum input{
  padding:10px;
  border:none;
  border-radius:8px;
}

#istekBolum button{
  background:#ffc107;
  color:#111;
}

/* MOBİL */
@media(max-width:600px){
  body{
    align-items:flex-start;
  }

  #overlay{
    margin:12px;
    padding:18px;
  }

  .controlRow{
    flex-direction:column;
    align-items:stretch;
  }

  #volume{
    width:100%;
  }

  #rightWidgets{
    flex-direction:row;
    justify-content:flex-start;
    margin-top:10px;
  }

  #durum{
    font-size:22px;
  }
}

.controlRow{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.songRow{
  flex:1;
  min-width:250px;
}

#rightWidgets{
  margin-left:auto;
  display:flex;
  gap:15px;
  align-items:center;
}

.controlRow{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

#rightWidgets{
  margin-left:auto;
  display:flex;
  gap:14px;
  align-items:center;
}

.songRow{
  margin-top:18px;
}
  
  
</style>
</head>

<body>

<div id="overlay">

  <div class="topBar">
    <div>
      <div id="baslik">📻 DJ‑CIXO MANSUR RADYO</div>
      <div id="canli">🔴 CANLI YAYIN</div>
    </div>

    
  <div class="mainCard">

  <!-- ÜST SATIR -->
  <div class="controlRow">

    <button id="play">▶ DİNLEMEYE BAŞLA</button>

    <button id="pause">■</button>

    <div id="volumeBox">
      🔊
      <input type="range"
             id="volume"
             min="0"
             max="1"
             step="0.01"
             value="1">
    </div>

    <!-- HAVA + SAAT -->
    <div id="rightWidgets">
      <div id="weatherBox">
        <div id="weatherCity">📍 Diyarbakır</div>
        <div id="weatherTemp">--°C</div>
        <div id="weatherDesc">Yükleniyor...</div>
      </div>

      <div id="clockBox">
        <div id="clockTime">00:00</div>
        <div id="clockDate">26.07.2026</div>
        <div id="clockDay">Pazar</div>
      </div>
    </div>

  </div>

  <!-- ALT SATIR (ŞARKI) -->
  <div class="songRow">
    <div id="durum"></div>
    <div id="siradaki"></div>
  </div>

</div>

  <div id="istekBolum">
    <input id="istekAd" type="text" placeholder="ADINIZ">
    <input id="istekMesaj" type="text" placeholder="ŞARKICI VE ŞARKIı">
    <button onclick="istekGonder()">Gönder</button>
    <div id="istekDurum"></div>
  </div>

</div>

<audio id="player"></audio>

<script>
const PROJECT_URL="https://xiidhsrcyjtcwcwbomga.supabase.co";
const ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk";
const client=supabase.createClient(PROJECT_URL,ANON_KEY);

const player=document.getElementById("player");
const durum=document.getElementById("durum");
const siradakiEl=document.getElementById("siradaki");

let muzikler = [];
let jingles = [];
let anonslar = [];

let sira = 0;
let adim = 0;

let calisiyor = false;
  
let ezanSaatleri = {};
let ezanModu = false;

async function verileriYukle(){

    const { data } = await client
        .from("songs")
        .select("*");

    muzikler = (data || []).filter(x => x.type === "music");
    jingles  = (data || []).filter(x => x.type === "jingle");
    anonslar = (data || []).filter(x => x.type === "anons");

    karistir(muzikler);

}
function karistir(dizi){

    for(let i=dizi.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [dizi[i],dizi[j]]=[dizi[j],dizi[i]];

    }

}
  
function cal(){

    if(!muzikler.length) return;

    let aktif;

    if(adim===0){

        aktif = muzikler[sira];

        durum.innerText="🎵 "+(aktif.title || "Müzik");

        siradakiEl.innerText="Sıradaki: "+(muzikler[(sira+1)%muzikler.length]?.title || "-");

    }
    else if(adim===1 && jingles.length){

        aktif = jingles[Math.floor(Math.random()*jingles.length)];

        durum.innerText="🔔 Jingle";

    }
    else if(adim===2 && anonslar.length){

        aktif = anonslar[Math.floor(Math.random()*anonslar.length)];

        durum.innerText="📢 Anons";

    }
    else{

        gec();

        return;

    }

    player.src = aktif.url;

    player.play();

    calisiyor = true;

}

function gec(){

    while(true){

        adim++;

        if(adim > 2){

            adim = 0;

            sira++;

            if(sira >= muzikler.length){

                karistir(muzikler);

                sira = 0;

            }

        }

        // Müzik
        if(adim === 0){
            break;
        }

        // Jingle varsa
        if(adim === 1 && jingles.length){
            break;
        }

        // Anons varsa
        if(adim === 2 && anonslar.length){
            break;
        }

    }

    cal();

}

player.onended = gec;
document.getElementById("play").onclick=async()=>{if(!muzikler.length)await verileriYukle();cal();};
document.getElementById("pause").onclick=()=>player.pause();
document.getElementById("volume").oninput=e=>player.volume=e.target.value;

/* ===== SAAT ===== */
function saatGuncelle(){

    const d = new Date();

    document.getElementById("clockTime").innerText =
        String(d.getHours()).padStart(2,"0")+":"+
        String(d.getMinutes()).padStart(2,"0");

    document.getElementById("clockDate").innerText =
        String(d.getDate()).padStart(2,"0")+"."+
        String(d.getMonth()+1).padStart(2,"0")+"."+
        d.getFullYear();

    const gunler=[
        "Pazar",
        "Pazartesi",
        "Salı",
        "Çarşamba",
        "Perşembe",
        "Cuma",
        "Cumartesi"
    ];

    document.getElementById("clockDay").innerText =
        gunler[d.getDay()];

}
setInterval(saatGuncelle,1000); saatGuncelle();

/* ===== HAVA DURUMU (Diyarbakır) ===== */
async function havaDurumu(){
 const res=await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.9144&longitude=40.2306&current_weather=true");
 const j=await res.json();
 const sicaklik = j.current_weather.temperature;

const kod = j.current_weather.weathercode;

let aciklama = "Açık";

if(kod>=1 && kod<=3) aciklama="Parçalı Bulutlu";
if(kod>=45 && kod<=48) aciklama="Sisli";
if(kod>=51 && kod<=67) aciklama="Yağmurlu";
if(kod>=71 && kod<=77) aciklama="Karlı";
if(kod>=95) aciklama="Fırtına";

document.getElementById("weatherTemp").innerText =
sicaklik+"°C";

document.getElementById("weatherDesc").innerText =
aciklama;
}
havaDurumu();

ezan();

setInterval(ezanKontrol,1000);
  
/* ===== EZAN SAATİ ===== */
async function ezan(){

    const r = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Diyarbakir&country=Turkey&method=13");

    const j = await r.json();

    const t = j.data.timings;

    ezanSaatleri = {
        Fajr: t.Fajr.slice(0,5),
        Dhuhr: t.Dhuhr.slice(0,5),
        Asr: t.Asr.slice(0,5),
        Maghrib: t.Maghrib.slice(0,5),
        Isha: t.Isha.slice(0,5)
    };

 
}
function ezanKontrol(){

    if(ezanModu) return;

    const simdi = new Date();

    const saat =
        String(simdi.getHours()).padStart(2,"0") + ":" +
        String(simdi.getMinutes()).padStart(2,"0");

    if(Object.values(ezanSaatleri).includes(saat)){

        ezanModu = true;

        player.pause();

        durum.innerText = "🕌 EZAN VAKTİ - Yayın durduruldu";

        setTimeout(function(){

            ezanModu = false;

            durum.innerText = "";

            player.play();

        }, 5 * 60 * 1000); // 5 dakika

    }

}
/* ===== İSTEK ===== */
async function istekGonder(){
 const ad=document.getElementById("istekAd").value.trim();
 const mesaj=document.getElementById("istekMesaj").value.trim();
 if(!ad||!mesaj)return;
 await client.from("requests").insert({name:ad,message:mesaj});
 document.getElementById("istekDurum").innerText="✅ Gönderildi";
}
havaDurumu();

ezan();

setInterval(ezanKontrol,1000);
  
</script>
</body>
</html>
