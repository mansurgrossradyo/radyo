<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mansur Gross Radyo</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:Arial, sans-serif;
  color:white;
  background: url("https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4") no-repeat center center/cover;
}

#panel {
  background: rgba(0,0,0,0.75);
  padding:40px 60px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
}

#baslik {
  font-size:40px;
  margin-bottom:20px;
}

#durum {
  margin-top:20px;
  font-size:22px;
  min-height:30px;
}

button {
  font-size:26px;
  padding:15px 40px;
  margin:10px;
  border:none;
  border-radius:12px;
  cursor:pointer;
}

#play {
  background:#28a745;
  color:white;
}

#pause {
  background:#dc3545;
  color:white;
}
</style>
</head>

<body>

<div id="panel">
  <div id="baslik">🎧 MANSUR GROSS RADYO</div>

  <button id="play">▶ PLAY</button>
  <button id="pause">⏸ PAUSE</button>

  <div id="durum"></div>
</div>

<audio id="player"></audio>

<script>
// ===== DOSYALAR =====
const muzikler = [
  "muzik/muzik(1).mp3",
  "muzik/muzik(2).mp3",
  "muzik/muzik(3).mp3",
  "muzik/muzik(4).mp3",
  "muzik/muzik(5).mp3"
];

const jingle = "jingle/Mansur Gross jingıl.mp3";

const anonslar = [
  "anons/mansur 20-30 Haziran-1.mp3"
];
// ====================

const player = document.getElementById("player");
const durum = document.getElementById("durum");

let sira = 0;
let adim = 0;

function karistir(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

karistir(muzikler);

function cal(){
  let dosya="";
  if(adim===0){
    dosya = muzikler[sira];
    durum.innerText="🎵 Müzik Çalıyor";
  } else if(adim===1){
    dosya = jingle;
    durum.innerText="🔔 Jingle";
  } else {
    if(anonslar.length>0){
      dosya = anonslar[Math.floor(Math.random()*anonslar.length)];
      durum.innerText="📢 Anons";
    } else {
      gec();
      return;
    }
  }
  player.src = encodeURI(dosya);
  player.play();
}

function gec(){
  adim++;
  if(adim>2){
    adim=0;
    sira++;
    if(sira>=muzikler.length){
      karistir(muzikler);
      sira=0;
    }
  }
  cal();
}

player.onended = gec;
player.onerror = gec;

document.getElementById("play").onclick = function(){
  if(player.src===""){
    cal();
  } else {
    player.play();
  }
};

document.getElementById("pause").onclick = function(){
  player.pause();
};
</script>

</body>
</html>
