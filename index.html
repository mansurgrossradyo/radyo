<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mansur Gross Radyo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  font-family:Arial, sans-serif;
  color:white;
  background: url("bg.jpg") no-repeat center center/cover;
}

#overlay {
  width:100%;
  background:rgba(0,0,0,0.65);
  text-align:center;
  padding:30px 0;
}

#baslik {
  font-size:40px;
  margin-bottom:15px;
}

#durum {
  font-size:22px;
  margin-top:15px;
  min-height:30px;
}

button {
  font-size:24px;
  padding:12px 35px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#play { background:#28a745; color:white; }
#pause { background:#dc3545; color:white; }
</style>
</head>

<body>

<div id="overlay">
  <div id="baslik">📻 MANSUR GROSS RADYO</div>

  <button id="play">▶ BAŞLAT</button>
  <button id="DURDUR">⏸ DURDUR</button>

  <div id="durum"></div>
</div>

<audio id="player"></audio>

<script>
const PROJECT_URL = "https://xiidhsrcyjtcwcwbomga.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk";  // 🔴 BURAYA KENDİ KEYİNİ YAZ

const client = supabase.createClient(PROJECT_URL, ANON_KEY);

const player = document.getElementById("player");
const durum = document.getElementById("durum");

let muzikler = [];
let jingles = [];
let anonslar = [];

let sira = 0;
let adim = 0;

function karistir(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

async function verileriYukle(){
  const { data, error } = await client.from("songs").select("*");

  if(error){
    console.error(error);
    durum.innerText = "Veri hatası";
    return;
  }

  muzikler = data.filter(x => x.type === "music");
  jingles = data.filter(x => x.type === "jingle");
  anonslar = data.filter(x => x.type === "anons");

  karistir(muzikler);
}

function cal(){
  if(muzikler.length === 0){
    durum.innerText = "Müzik yok";
    return;
  }

  let url = "";

  if(adim === 0){
    url = muzikler[sira].url;
    durum.innerText = "🎵 Müzik Çalıyor";
  }
  else if(adim === 1 && jingles.length > 0){
    url = jingles[Math.floor(Math.random()*jingles.length)].url;
    durum.innerText = "🔔 Jingle";
  }
  else if(adim === 2 && anonslar.length > 0){
    url = anonslar[Math.floor(Math.random()*anonslar.length)].url;
    durum.innerText = "📢 Anons";
  }
  else{
    gec();
    return;
  }

  player.src = url;
  player.play();
}

function gec(){
  adim++;
  if(adim > 2){
    adim = 0;
    sira++;
    if(sira >= muzikler.length){
      karistir(muzikler);
      sira = 0;
    }
  }
  cal();
}

player.onended = gec;
player.onerror = gec;

document.getElementById("play").onclick = async function(){
  if(muzikler.length === 0){
    await verileriYukle();
  }
  cal();
};

document.getElementById("pause").onclick = function(){
  player.pause();
};
</script>

</body>
</html>
