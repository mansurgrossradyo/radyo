<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mansur Gross Radyo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:url("bg.jpg") center/cover no-repeat fixed;
  height:100vh;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  color:#fff;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(3px);
  z-index:-1;
}

/* ===== ANA CAM KART ===== */
#overlay{
  width:95%; max-width:1300px;
  margin-bottom:30px;
  background:rgba(20,20,20,.55);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:35px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* ===== ÜST BAR ===== */
.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:25px;
}
#baslik{font-size:30px;font-weight:700}
#canli{
  color:#28ff63;
  font-weight:bold;
  margin-top:6px;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:.4}}

/* ===== EZAN KUTUSU ===== */
#ezanBilgi{
  background:#0f172a;
  padding:14px 20px;
  border-radius:14px;
  font-size:14px;
  border:1px solid rgba(255,255,255,.1);
}

/* ===== SAĞ WIDGET ===== */
#rightWidgets{
  display:flex;
  align-items:center;
  gap:20px;
}

#clockBox{
  background:#fff;
  color:#111;
  padding:15px 20px;
  border-radius:18px;
  font-size:32px;
  font-weight:bold;
  min-width:130px;
}

#weatherBox{
  background:#1f2937;
  padding:15px 20px;
  border-radius:18px;
  font-size:14px;
}

/* ===== KONTROL ALANI ===== */
.mainCard{
  background:rgba(255,255,255,.05);
  padding:25px;
  border-radius:22px;
  margin-bottom:25px;
}

.controlRow{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

button{
  border:none;
  cursor:pointer;
  border-radius:18px;
  padding:18px 40px;
  font-size:20px;
  font-weight:bold;
  transition:.2s;
}
button:hover{transform:translateY(-2px)}

#play{
  background:#ffc107;
  color:#111;
}
#pause{
  background:#ff3d4f;
  color:#fff;
}

#volumeBox{
  display:flex;
  align-items:center;
  gap:10px;
}
#volume{
  width:200px;
  accent-color:#ffc107;
}

/* ===== ŞARKI ALANI ===== */
.songRow{
  margin-top:25px;
}
#durum{
  font-size:34px;
  font-weight:bold;
}
#siradaki{
  margin-top:6px;
  opacity:.7;
  font-size:16px;
}

/* ===== İSTEK ===== */
#istekBolum{
  margin-top:20px;
  background:rgba(255,255,255,.05);
  padding:18px;
  border-radius:20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}
#istekBolum input{
  padding:12px;
  border:none;
  border-radius:10px;
}
#istekBolum button{
  background:#ffc107;
  color:#111;
  padding:12px 25px;
}

@media(max-width:900px){
  #rightWidgets{flex-direction:column;align-items:flex-end}
  #clockBox{font-size:26px}
}
</style>
</head>

<body>

<div id="overlay">

  <div class="topBar">
    <div>
      <div id="baslik">📻 DJ‑CIXO MANSUR RADYO</div>
      <div id="canli">🔴 CANLI YAYIN</div>
    </div>

    <div id="rightWidgets">
      <div id="ezanBilgi">🕌 Yükleniyor...</div>
      <div id="weatherBox">🌤 Yükleniyor...</div>
      <div id="clockBox">00:00</div>
    </div>
  </div>

  <div class="mainCard">
    <div class="controlRow">
      <button id="play">▶ DİNLEMEYE BAŞLA</button>
      <button id="pause">■</button>

      <div id="volumeBox">
        🔊
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      </div>
    </div>

    <div class="songRow">
      <div id="durum"></div>
      <div id="siradaki"></div>
    </div>
  </div>

  <div id="istekBolum">
    <input id="istekAd" type="text" placeholder="Adınız">
    <input id="istekMesaj" type="text" placeholder="İstediğiniz şarkı">
    <button onclick="istekGonder()">Gönder</button>
    <div id="istekDurum"></div>
  </div>

</div>

<audio id="player"></audio>

<script>
const PROJECT_URL="https://xiidhsrcyjtcwcwbomga.supabase.co";
const ANON_KEY="ANON_KEYİNİ_YAZ";
const client=supabase.createClient(PROJECT_URL,ANON_KEY);

const player=document.getElementById("player");
const durum=document.getElementById("durum");
const siradakiEl=document.getElementById("siradaki");
let muzikler=[],sira=0;

async function verileriYukle(){
 const {data}=await client.from("songs").select("*").eq("type","music");
 muzikler=data||[];
}

function cal(){
 if(!muzikler.length)return;
 const aktif=muzikler[sira];
 player.src=aktif.url;
 player.play();
 durum.innerText="🎵 "+aktif.title;
 siradakiEl.innerText="Sıradaki: "+(muzikler[(sira+1)%muzikler.length]?.title||"-");
}

player.onended=()=>{sira=(sira+1)%muzikler.length;cal();};
document.getElementById("play").onclick=async()=>{if(!muzikler.length)await verileriYukle();cal();};
document.getElementById("pause").onclick=()=>player.pause();
document.getElementById("volume").oninput=e=>player.volume=e.target.value;

/* ===== SAAT ===== */
function saatGuncelle(){
 const d=new Date();
 document.getElementById("clockBox").innerText=
   d.getHours().toString().padStart(2,"0")+":"+
   d.getMinutes().toString().padStart(2,"0");
}
setInterval(saatGuncelle,1000); saatGuncelle();

/* ===== HAVA DURUMU (Diyarbakır) ===== */
async function havaDurumu(){
 const res=await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.9144&longitude=40.2306&current_weather=true");
 const j=await res.json();
 document.getElementById("weatherBox").innerHTML=
   "🌤 Diyarbakır<br>"+j.current_weather.temperature+"°C";
}
havaDurumu();

/* ===== EZAN SAATİ ===== */
async function ezan(){
 const r=await fetch("https://api.aladhan.com/v1/timingsByCity?city=Diyarbakir&country=Turkey&method=13");
 const j=await r.json();
 const t=j.data.timings;
 document.getElementById("ezanBilgi").innerText=
  "🕌 Sabah "+t.Fajr.slice(0,5)+
  " • Öğle "+t.Dhuhr.slice(0,5)+
  " • İkindi "+t.Asr.slice(0,5)+
  " • Akşam "+t.Maghrib.slice(0,5)+
  " • Yatsı "+t.Isha.slice(0,5);
}
ezan();

/* ===== İSTEK ===== */
async function istekGonder(){
 const ad=document.getElementById("istekAd").value.trim();
 const mesaj=document.getElementById("istekMesaj").value.trim();
 if(!ad||!mesaj)return;
 await client.from("requests").insert({name:ad,message:mesaj});
 document.getElementById("istekDurum").innerText="✅ Gönderildi";
}
</script>
</body>
</html>
