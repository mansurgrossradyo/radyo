<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mansur Gross Radyo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:url("bg.jpg") center/cover no-repeat fixed;
  height:100vh;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  color:#fff;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35); /* sadece karartma */
  z-index:-1;
}

/* ===== ANA CAM KART ===== */
#overlay{
  width:95%; max-width:1300px;
  margin-bottom:30px;
  background:rgba(20,20,20,.55);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:35px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* ===== ÜST BAR ===== */
.topBar{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  margin-bottom:25px;
}
#baslik{font-size:30px;font-weight:700}
#canli{
  color:#28ff63;
  font-weight:bold;
  margin-top:6px;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:.4}}

/* ===== EZAN KUTUSU ===== */
#ezanBilgi{
  background:#0f172a;
  padding:14px 20px;
  border-radius:14px;
  font-size:14px;
  border:1px solid rgba(255,255,255,.1);
}

/* ===== SAĞ WIDGET ===== */
#rightWidgets{
  display:flex;
  align-items:center;
  gap:20px;
}

#clockBox{

    width:150px;

    background:white;

    color:#111;

    border-radius:18px;

    text-align:center;

    padding:14px;

    box-shadow:0 10px 25px rgba(0,0,0,.25);

}

#clockTime{

    font-size:42px;

    font-weight:700;

    line-height:1;

}

#clockDate{

    margin-top:8px;

    font-size:15px;

    color:#666;

}

#clockDay{

    margin-top:4px;

    font-size:16px;

    font-weight:bold;

    color:#ffb300;

}

#weatherBox{

    width:170px;

    padding:14px;

    border-radius:18px;

    background:linear-gradient(135deg,#182848,#4b6cb7);

    color:white;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.35);

}

#weatherCity{

    font-size:15px;

    opacity:.9;

}

#weatherTemp{

    font-size:34px;

    font-weight:bold;

    margin-top:6px;

}

#weatherDesc{

    margin-top:5px;

    font-size:14px;

    opacity:.85;

}

/* ===== KONTROL ALANI ===== */
.mainCard{
  background:rgba(255,255,255,.05);
  padding:25px;
  border-radius:22px;
  margin-bottom:25px;
}

.controlRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

button{
  border:none;
  cursor:pointer;
  border-radius:18px;
  padding:18px 40px;
  font-size:20px;
  font-weight:bold;
  transition:.2s;
}
button:hover{transform:translateY(-2px)}

#play{
  background:#ffc107;
  color:#111;
}
#pause{
  background:#ff3d4f;
  color:#fff;
}

#volumeBox{
  display:flex;
  align-items:center;
  gap:10px;
}
#volume{
  width:200px;
  accent-color:#ffc107;
}

/* ===== ŞARKI ALANI ===== */
.songRow{
  margin-top:25px;
}
#durum{
  font-size:34px;
  font-weight:bold;
}
#siradaki{
  margin-top:6px;
  opacity:.7;
  font-size:16px;
}

/* ===== İSTEK ===== */
#istekBolum{
  margin-top:20px;
  background:rgba(255,255,255,.05);
  padding:18px;
  border-radius:20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}
#istekBolum input{
  padding:12px;
  border:none;
  border-radius:10px;
}
#istekBolum button{
  background:#ffc107;
  color:#111;
  padding:12px 25px;
}

@media(max-width:900px){
  #rightWidgets{flex-direction:column;align-items:flex-end}
  #clockBox{font-size:26px}
}

/* =========================================
   MOBİL TELEFON DÜZENİ
   Bu kodu style bölümünün EN ALTINA ekle
========================================= */
@media (max-width: 600px){

  body{
    height:auto;
    min-height:100svh;
    overflow-x:hidden;
    overflow-y:auto;
    align-items:flex-start;
    padding:12px 0;
    background-attachment:scroll;
  }

  #overlay{
    width:calc(100% - 24px);
    margin:12px;
    padding:16px;
    border-radius:22px;
  }

  /* Üst başlık, hava ve saat */
  .topBar{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
    margin-bottom:16px;
  }

  #baslik{
    font-size:21px;
    line-height:1.2;
  }

  #canli{
    font-size:14px;
    margin-top:5px;
    margin-bottom:0;
  }

  #rightWidgets{
    width:100%;
    display:flex;
    flex-direction:row;
    justify-content:flex-start;
    align-items:stretch;
    gap:10px;
  }

  #weatherBox{
    flex:1;
    padding:10px 12px;
    font-size:12px;
    border-radius:13px;
  }

  #clockBox{
    min-width:105px;
    padding:10px 12px;
    font-size:25px;
    border-radius:13px;
  }

  /* Ezan kutusunu görünmez yapar.
     Ezan vakti müziği durdurma sistemi çalışmaya devam eder. */
  #ezanBilgi{
    display:none;
  }

  /* Kontrol kartı */
  .mainCard{
    padding:16px;
    border-radius:18px;
    margin-bottom:14px;
  }

  .controlRow{
    display:grid;
    grid-template-columns:1fr 60px;
    gap:12px;
    align-items:center;
  }

  button{
    font-size:16px;
    padding:15px 12px;
    margin:0;
  }

  #play{
    width:100%;
    border-radius:15px;
    white-space:nowrap;
  }

  #pause{
    width:60px;
    height:52px;
    padding:0;
    margin:0;
    border-radius:15px;
    font-size:18px;
  }

  #volumeBox{
    grid-column:1 / -1;
    width:100%;
    margin-top:2px;
    font-size:15px;
  }

  #volume{
    width:calc(100% - 48px);
  }

  /* Şarkı adı alanı */
  .songRow{
    margin-top:18px;
  }

  #durum{
    font-size:24px;
    line-height:1.25;
    overflow-wrap:anywhere;
    word-break:break-word;
  }

  #siradaki{
    margin-top:8px;
    font-size:15px;
    line-height:1.35;
    overflow-wrap:anywhere;
  }

  /* İstek formu */
  #istekBolum{
    margin-top:14px;
    padding:16px;
    border-radius:18px;
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }

  #istekBolum h3{
    font-size:16px;
    margin:0 0 2px 0;
  }

  #istekBolum input{
    width:100%;
    height:46px;
    padding:10px 12px;
    margin:0;
    font-size:15px;
  }

  #istekBolum button{
    width:130px;
    padding:12px 18px;
    font-size:16px;
  }

  #istekDurum{
    margin-top:0;
    font-size:14px;
  }
}

/* ===== PREMIUM ELİT AYAR ===== */

/* Genel kart biraz daha ince */
#overlay{
  padding:28px !important;
  border-radius:24px !important;
}

/* Başlık daha zarif */
#baslik{
  font-size:26px !important;
  font-weight:600 !important;
  letter-spacing:0.5px !important;
}

/* Canlı yazısı daha minimal */
#canli{
  font-size:14px !important;
}

/* Saat kutusu biraz küçülsün */
#clockBox{
  width:130px !important;
  padding:12px !important;
}

#clockTime{
  font-size:34px !important;
}

#clockDate{
  font-size:13px !important;
}

#clockDay{
  font-size:14px !important;
}

/* Hava durumu küçülsün */
#weatherBox{
  width:150px !important;
  padding:12px !important;
}

#weatherTemp{
  font-size:26px !important;
}

/* Butonları daha premium yap */
button{
  padding:14px 28px !important;
  font-size:17px !important;
  border-radius:14px !important;
}

/* Stop butonu daha kompakt */
#pause{
  padding:14px 18px !important;
}

/* Ses barı incelsin */
#volume{
  width:170px !important;
}

/* Şarkı başlığı biraz daha elit */
#durum{
  font-size:28px !important;
  font-weight:600 !important;
  line-height:1.3 !important;
}

/* Sıradaki minimal */
#siradaki{
  font-size:14px !important;
  opacity:0.6 !important;
}

/* İstek alanı incelsin */
#istekBolum{
  padding:14px !important;
  border-radius:16px !important;
}

#istekBolum input{
  height:40px !important;
  font-size:14px !important;
}

#istekBolum button{
  padding:10px 20px !important;
  font-size:15px !important;
}

/* ===== CAM KART DARALTMA ===== */

/* Ana büyük cam kartı daralt */
#overlay{
  max-width:1100px !important;
  padding:25px !important;
}

/* İçteki şarkı cam kartı daha ince */
.mainCard{
  padding:18px !important;
  border-radius:18px !important;
}

/* Şarkı alanı daha kompakt */
.songRow{
  margin-top:18px !important;
}

/* İstek cam kartı incelsin */
#istekBolum{
  padding:12px !important;
  border-radius:16px !important;
}

/* İç boşlukları biraz azalt */
#panelContainer{
  gap:20px !important;
}

#rightWidgets{
  display:flex;
  align-items:center;
  gap:15px;
  margin-left:auto;
}  
  
</style>
</head>

<body>

<div id="overlay">

  <div class="topBar">
    <div>
      <div id="baslik">📻 DJ‑CIXO MANSUR RADYO</div>
      <div id="canli">🔴 CANLI YAYIN</div>
    </div>

    
  <div class="mainCard">
    <div class="controlRow">
      <button id="play">▶ DİNLEMEYE BAŞLA</button>
      <button id="pause">■</button>

      <div id="volumeBox">
        🔊
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      </div>
    </div>

    <div class="songRow">
      <div id="durum"></div>
      <div id="siradaki"></div>
    </div>
  </div>

    <div id="rightWidgets">
      <div id="weatherBox">
      
          <div id="weatherCity">📍 Diyarbakır</div>
      
          <div id="weatherTemp">--°C</div>
      
          <div id="weatherDesc">Yükleniyor...</div>
      
      </div>
    <div id="clockBox">
        <div id="clockTime">00:00</div>
        <div id="clockDate">26.07.2026</div>
        <div id="clockDay">Pazar</div>
    </div>
    </div>
  </div>

  <div id="istekBolum">
    <input id="istekAd" type="text" placeholder="ADINIZ">
    <input id="istekMesaj" type="text" placeholder="ŞARKICI VE ŞARKIı">
    <button onclick="istekGonder()">Gönder</button>
    <div id="istekDurum"></div>
  </div>

</div>

<audio id="player"></audio>

<script>
const PROJECT_URL="https://xiidhsrcyjtcwcwbomga.supabase.co";
const ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk";
const client=supabase.createClient(PROJECT_URL,ANON_KEY);

const player=document.getElementById("player");
const durum=document.getElementById("durum");
const siradakiEl=document.getElementById("siradaki");

let muzikler = [];
let jingles = [];
let anonslar = [];

let sira = 0;
let adim = 0;

let calisiyor = false;
  
let ezanSaatleri = {};
let ezanModu = false;

async function verileriYukle(){

    const { data } = await client
        .from("songs")
        .select("*");

    muzikler = (data || []).filter(x => x.type === "music");
    jingles  = (data || []).filter(x => x.type === "jingle");
    anonslar = (data || []).filter(x => x.type === "anons");

    karistir(muzikler);

}
function karistir(dizi){

    for(let i=dizi.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [dizi[i],dizi[j]]=[dizi[j],dizi[i]];

    }

}
  
function cal(){

    if(!muzikler.length) return;

    let aktif;

    if(adim===0){

        aktif = muzikler[sira];

        durum.innerText="🎵 "+(aktif.title || "Müzik");

        siradakiEl.innerText="Sıradaki: "+(muzikler[(sira+1)%muzikler.length]?.title || "-");

    }
    else if(adim===1 && jingles.length){

        aktif = jingles[Math.floor(Math.random()*jingles.length)];

        durum.innerText="🔔 Jingle";

    }
    else if(adim===2 && anonslar.length){

        aktif = anonslar[Math.floor(Math.random()*anonslar.length)];

        durum.innerText="📢 Anons";

    }
    else{

        gec();

        return;

    }

    player.src = aktif.url;

    player.play();

    calisiyor = true;

}

function gec(){

    while(true){

        adim++;

        if(adim > 2){

            adim = 0;

            sira++;

            if(sira >= muzikler.length){

                karistir(muzikler);

                sira = 0;

            }

        }

        // Müzik
        if(adim === 0){
            break;
        }

        // Jingle varsa
        if(adim === 1 && jingles.length){
            break;
        }

        // Anons varsa
        if(adim === 2 && anonslar.length){
            break;
        }

    }

    cal();

}

player.onended = gec;
document.getElementById("play").onclick=async()=>{if(!muzikler.length)await verileriYukle();cal();};
document.getElementById("pause").onclick=()=>player.pause();
document.getElementById("volume").oninput=e=>player.volume=e.target.value;

/* ===== SAAT ===== */
function saatGuncelle(){

    const d = new Date();

    document.getElementById("clockTime").innerText =
        String(d.getHours()).padStart(2,"0")+":"+
        String(d.getMinutes()).padStart(2,"0");

    document.getElementById("clockDate").innerText =
        String(d.getDate()).padStart(2,"0")+"."+
        String(d.getMonth()+1).padStart(2,"0")+"."+
        d.getFullYear();

    const gunler=[
        "Pazar",
        "Pazartesi",
        "Salı",
        "Çarşamba",
        "Perşembe",
        "Cuma",
        "Cumartesi"
    ];

    document.getElementById("clockDay").innerText =
        gunler[d.getDay()];

}
setInterval(saatGuncelle,1000); saatGuncelle();

/* ===== HAVA DURUMU (Diyarbakır) ===== */
async function havaDurumu(){
 const res=await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.9144&longitude=40.2306&current_weather=true");
 const j=await res.json();
 const sicaklik = j.current_weather.temperature;

const kod = j.current_weather.weathercode;

let aciklama = "Açık";

if(kod>=1 && kod<=3) aciklama="Parçalı Bulutlu";
if(kod>=45 && kod<=48) aciklama="Sisli";
if(kod>=51 && kod<=67) aciklama="Yağmurlu";
if(kod>=71 && kod<=77) aciklama="Karlı";
if(kod>=95) aciklama="Fırtına";

document.getElementById("weatherTemp").innerText =
sicaklik+"°C";

document.getElementById("weatherDesc").innerText =
aciklama;
}
havaDurumu();

ezan();

setInterval(ezanKontrol,1000);
  
/* ===== EZAN SAATİ ===== */
async function ezan(){

    const r = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Diyarbakir&country=Turkey&method=13");

    const j = await r.json();

    const t = j.data.timings;

    ezanSaatleri = {
        Fajr: t.Fajr.slice(0,5),
        Dhuhr: t.Dhuhr.slice(0,5),
        Asr: t.Asr.slice(0,5),
        Maghrib: t.Maghrib.slice(0,5),
        Isha: t.Isha.slice(0,5)
    };

 
}
function ezanKontrol(){

    if(ezanModu) return;

    const simdi = new Date();

    const saat =
        String(simdi.getHours()).padStart(2,"0") + ":" +
        String(simdi.getMinutes()).padStart(2,"0");

    if(Object.values(ezanSaatleri).includes(saat)){

        ezanModu = true;

        player.pause();

        durum.innerText = "🕌 EZAN VAKTİ - Yayın durduruldu";

        setTimeout(function(){

            ezanModu = false;

            durum.innerText = "";

            player.play();

        }, 5 * 60 * 1000); // 5 dakika

    }

}
/* ===== İSTEK ===== */
async function istekGonder(){
 const ad=document.getElementById("istekAd").value.trim();
 const mesaj=document.getElementById("istekMesaj").value.trim();
 if(!ad||!mesaj)return;
 await client.from("requests").insert({name:ad,message:mesaj});
 document.getElementById("istekDurum").innerText="✅ Gönderildi";
}
havaDurumu();

ezan();

setInterval(ezanKontrol,1000);
  
</script>
</body>
</html>
