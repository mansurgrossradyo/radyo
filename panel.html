<script>
const PROJECT_URL = "https://xiidhsrcyjtcwcwbomga.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk";

const client = supabase.createClient(PROJECT_URL, ANON_KEY);

document.getElementById("btn").onclick = async function () {

  const fileInput = document.getElementById("file");
  const type = document.getElementById("type").value;
  const titleInput = document.getElementById("title").value;

  if (!fileInput.files.length) {
    alert("Dosya seç");
    return;
  }

  const file = fileInput.files[0];

  // Eğer title boşsa dosya adını kullan
  const originalName = file.name.replace(".mp3", "");
  const title = titleInput.trim() === "" ? originalName : titleInput;

  document.getElementById("msg").innerText = "Yükleniyor...";

  const safeName = "uploads/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.]/g, "_");

  // Upload
  const { error: upErr } = await client.storage
    .from("radyo")
    .upload(safeName, file, { upsert: true });

  if (upErr) {
    console.error(upErr);
    document.getElementById("msg").innerText = "";
    alert("Storage hatası: " + upErr.message);
    return;
  }

  const { data } = client.storage.from("radyo").getPublicUrl(safeName);

  // Database kayıt
  const { error: dbErr } = await client.from("songs").insert({
    title: title,
    url: data.publicUrl,
    type: type
  });

  if (dbErr) {
    console.error(dbErr);
    document.getElementById("msg").innerText = "";
    alert("DB hatası: " + dbErr.message);
    return;
  }

  document.getElementById("msg").innerText = "";
  document.getElementById("title").value = "";
  document.getElementById("file").value = "";

  alert("✅ Başarıyla yüklendi!");
  listele();
};

async function listele() {
  const { data, error } = await client.from("songs").select("*").order("id");
  if (error) {
    console.error(error);
    return;
  }

  let html = "<h3>📋 Yüklü Dosyalar</h3>";

  data.forEach(s => {
    const icon = s.type === "music" ? "🎵" :
                 s.type === "jingle" ? "🔔" : "📢";

    html += `
      <div class="satir">
        <span>${icon} ${s.title}</span>
        <button class="sil" onclick="sil(${s.id})">SİL</button>
      </div>
    `;
  });

  document.getElementById("liste").innerHTML = html;
}

async function sil(id) {
  if (!confirm("Silinsin mi?")) return;

  const { error } = await client.from("songs").delete().eq("id", id);
  if (error) {
    alert("Silme hatası: " + error.message);
    return;
  }

  listele();
}

listele();
</script>
