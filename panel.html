<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radyo Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{ box-sizing:border-box; margin:0; padding:0; }

body {
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1a1a1a 0%, #0b0b0b 55%, #000 100%);
  color: #fff;
  min-height: 100vh;
  padding: 30px 20px 50px;
}

/* ===== LOGIN ===== */
#loginBox{
  max-width: 400px;
  margin: 100px auto;
  background: #1b1b1b;
  padding: 30px;
  border-radius: 14px;
  text-align: center;
}

#loginBox h2 { margin-bottom: 20px; }

#loginBox input {
  display: block;
  width: 100%;
  margin: 8px 0;
  padding: 12px;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #222;
  color: #fff;
  outline: none;
}

#loginBox button {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #111;
  cursor: pointer;
}

#loginMsg {
  color: #ff5555;
  margin-top: 10px;
  font-size: 14px;
}

/* ===== PANEL ===== */
#panelContent { max-width: 1200px; margin: 0 auto; }

/* HEADER */
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 16px;
}

.panel-badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 2px;
  color: #111;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  padding: 4px 10px;
  border-radius: 999px;
  font-weight: 800;
  margin-bottom: 6px;
}

.panel-title h1 {
  font-size: 30px;
  letter-spacing: 1px;
}

.panel-title p {
  color: rgba(255,255,255,.4);
  font-size: 13px;
  margin-top: 4px;
}

.cikis-btn {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  font-weight: 700;
  font-size: 15px;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,65,108,.3);
  transition: .2s;
}

.cikis-btn:hover { transform: scale(1.04); }

/* UPLOAD KARTI */
.upload-card {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 20px;
  padding: 20px 24px;
  margin-bottom: 32px;
}

.upload-card-title {
  font-size: 15px;
  font-weight: 700;
  color: #ffd200;
  margin-bottom: 16px;
  text-align: left;
}

.upload-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.upload-row input[type="text"] {
  flex: 1;
  min-width: 180px;
  padding: 11px 14px;
  font-size: 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.08);
  color: #fff;
  outline: none;
}

.upload-row input[type="text"]:focus {
  border-color: #ffd200;
}

.upload-row select {
  padding: 11px 14px;
  font-size: 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.08);
  color: #fff;
  outline: none;
  cursor: pointer;
}

.upload-row select option {
  background: #1b1b1b;
}

/* DOSYA ETİKETİ */
.file-label {
  padding: 11px 16px;
  font-size: 14px;
  border-radius: 12px;
  border: 1px dashed rgba(255,255,255,.3);
  background: rgba(255,255,255,.06);
  color: #fff;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: .2s;
  white-space: nowrap;
}

.file-label:hover {
  border-color: #ffd200;
  background: rgba(255,210,0,.08);
}

.file-label.secildi {
  border-color: #28ff63;
  background: rgba(40,255,99,.08);
  color: #28ff63;
}

.file-label input[type="file"] {
  display: none;
}

/* YÜKLE BUTONU */
.yukle-btn {
  padding: 11px 28px;
  font-size: 15px;
  font-weight: 800;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #111;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 0 6px 20px rgba(255,200,0,.25);
  transition: .2s;
  white-space: nowrap;
}

.yukle-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(255,200,0,.35);
}

#msg {
  margin-top: 12px;
  font-size: 14px;
  font-weight: 600;
  min-height: 20px;
  text-align: left;
}

/* ALT KONTEYNER */
.alt-konteyner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}

.alt-kutu h2 {
  font-size: 17px;
  margin-bottom: 12px;
  text-align: left;
}

.scrollBox {
  background: #141414;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 14px;
  padding: 12px;
  max-height: 520px;
  overflow-y: auto;
}

.scrollBox::-webkit-scrollbar { width: 6px; }
.scrollBox::-webkit-scrollbar-track { background: #1a1a1a; }
.scrollBox::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

/* SATIR */
.satir {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: #1f1f1f;
  border: 1px solid rgba(255,255,255,.05);
  padding: 10px 12px;
  margin-bottom: 6px;
  border-radius: 8px;
  transition: background .15s;
}

.satir:hover { background: #2a2a2a; }

.satir span {
  flex: 1;
  font-size: 14px;
  text-align: left;
  word-break: break-word;
}

/* SİL BUTONU */
.sil-btn {
  flex-shrink: 0;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  background: #dc3545;
  color: #fff;
  cursor: pointer;
  transition: .2s;
}

.sil-btn:hover {
  background: #c82333;
  transform: scale(1.05);
}

.bos-mesaj {
  color: #444;
  font-size: 14px;
  padding: 16px;
  text-align: center;
}

@media(max-width:720px){
  .alt-konteyner { grid-template-columns: 1fr; }
  .panel-header { flex-direction: column; }
  .upload-row { flex-direction: column; }
  .upload-row input[type="text"],
  .upload-row select,
  .file-label,
  .yukle-btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox" style="display:none;">
  <h2>🔐 Panel Giriş</h2>
  <input type="email"     id="email"    placeholder="Email">
  <input type="password"  id="password" placeholder="Şifre">
  <button onclick="girisYap()">Giriş Yap</button>
  <div id="loginMsg"></div>
</div>

<!-- PANEL -->
<div id="panelContent" style="display:none;">

  <!-- HEADER -->
  <div class="panel-header">
    <div class="panel-title">
      <div class="panel-badge">LIVE ADMIN</div>
      <h1>🎛 RADYO PANEL</h1>
      <p>Şarkı yükle · Jingle ekle · İstekleri yönet</p>
    </div>
    <button class="cikis-btn" onclick="cikisYap()">⏻ Çıkış</button>
  </div>

  <!-- YÜKLEME KARTI -->
  <div class="upload-card">
    <div class="upload-card-title">⬆ Yeni Parça Yükle</div>
    <div class="upload-row">
      <input type="text" id="title" placeholder="Şarkı adı (boşsa dosya adından alır)">
      <select id="type">
        <option value="music">🎵 Müzik</option>
        <option value="jingle">🔔 Jingle</option>
        <option value="anons">📢 Anons</option>
      </select>
      <label class="file-label" id="fileLabel">
        📁 Dosya Seç
        <input type="file" id="file" accept="audio/*">
      </label>
      <button class="yukle-btn" id="btn">YÜKLE</button>
    </div>
    <div id="msg"></div>
  </div>

  <!-- İSTEK + LİSTE -->
  <div class="alt-konteyner">
    <div class="alt-kutu">
      <h2>🎵 Gelen İstekler</h2>
      <div class="scrollBox" id="istekler">
        <div class="bos-mesaj">Yükleniyor...</div>
      </div>
    </div>
    <div class="alt-kutu">
      <h2 id="listBaslik">📋 Şarkı Listesi</h2>
      <div class="scrollBox" id="liste">
        <div class="bos-mesaj">Yükleniyor...</div>
      </div>
    </div>
  </div>

</div><!-- /panelContent -->

<script>
const PROJECT_URL = "https://xiidhsrcyjtcwcwbomga.supabase.co";
const ANON_KEY    = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk";
const supa = supabase.createClient(PROJECT_URL, ANON_KEY);

/* ===== OTURUM ===== */
const OTURUM_DK  = 60;
const OTURUM_MS  = OTURUM_DK * 60 * 1000;
const GIRIS_KEY  = "radyo_giris_zamani";
let   cikisTimer = null;

async function kontrolEt(){
  const { data } = await supa.auth.getSession();
  if(data.session){
    let t = Number(localStorage.getItem(GIRIS_KEY));
    if(!t){ t = Date.now(); localStorage.setItem(GIRIS_KEY, t); }
    if(Date.now() - t >= OTURUM_MS){ await otomatikCikis(); return; }
    goster("panel");
    listele();
    istekleriGetir();
    clearTimeout(cikisTimer);
    cikisTimer = setTimeout(otomatikCikis, OTURUM_MS - (Date.now()-t));
  } else {
    goster("login");
  }
}

function goster(k){
  document.getElementById("loginBox").style.display    = k==="login"  ? "block" : "none";
  document.getElementById("panelContent").style.display = k==="panel" ? "block" : "none";
}

async function girisYap(){
  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("password").value;
  if(!email||!pass){ document.getElementById("loginMsg").innerText="Boş bırakma"; return; }
  const { error } = await supa.auth.signInWithPassword({ email, password: pass });
  if(error){ document.getElementById("loginMsg").innerText="Hatalı giriş"; return; }
  localStorage.setItem(GIRIS_KEY, Date.now());
  document.getElementById("loginMsg").innerText = "";
  kontrolEt();
}

async function cikisYap(){
  clearTimeout(cikisTimer);
  localStorage.removeItem(GIRIS_KEY);
  await supa.auth.signOut();
  kontrolEt();
}

async function otomatikCikis(){
  clearTimeout(cikisTimer);
  localStorage.removeItem(GIRIS_KEY);
  await supa.auth.signOut();
  goster("login");
  document.getElementById("loginMsg").innerText = "⏰ Oturum süresi doldu, tekrar giriş yapın.";
}

/* ===== DOSYA SEÇİNCE ===== */
document.getElementById("file").addEventListener("change", function(){
  const label = document.getElementById("fileLabel");
  if(this.files.length){
    const kisa = this.files[0].name.length > 25
      ? this.files[0].name.substring(0,25)+"..."
      : this.files[0].name;
    label.innerHTML = "✅ " + kisa + '<input type="file" id="file" accept="audio/*">';
    label.classList.add("secildi");
    // yeni input'a tekrar listener ekle
    label.querySelector("input").addEventListener("change", arguments.callee);
  } else {
    label.innerHTML = '📁 Dosya Seç<input type="file" id="file" accept="audio/*">';
    label.classList.remove("secildi");
    label.querySelector("input").addEventListener("change", arguments.callee);
  }
});

/* ===== MESAJ ===== */
let msgTimer = null;
function mesaj(txt, renk){
  const el = document.getElementById("msg");
  el.innerText   = txt;
  el.style.color = renk;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=>{ el.innerText=""; }, 3500);
}

/* ===== YÜKLE ===== */
document.getElementById("btn").addEventListener("click", async ()=>{

  const fileEl = document.getElementById("file") ||
                 document.querySelector("#fileLabel input");
  const type   = document.getElementById("type").value;
  const titleV = document.getElementById("title").value.trim();

  if(!fileEl || !fileEl.files.length){
    mesaj("⚠ Önce dosya seç!", "#ff5555"); return;
  }

  const file  = fileEl.files[0];
  const title = titleV !== ""
    ? titleV
    : file.name.replace(/\.[^/.]+$/,"").replace(/_/g," ").trim();

  /* Aynı şarkı kontrolü */
  const { data: var_ } = await supa.from("songs").select("id").ilike("title", title);
  if(var_ && var_.length){
    mesaj("⚠ Bu şarkı zaten listede var!", "#ffaa00"); return;
  }

  mesaj("⏳ Yükleniyor...", "#ccc");
  document.getElementById("btn").disabled = true;

  const yol = "uploads/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

  const { error: ue } = await supa.storage.from("radyo").upload(yol, file, { upsert:true });
  if(ue){ mesaj("❌ "+ue.message,"#ff5555"); document.getElementById("btn").disabled=false; return; }

  const { data: urlD } = supa.storage.from("radyo").getPublicUrl(yol);

  const { error: de } = await supa.from("songs").insert({ title, url: urlD.publicUrl, type });
  if(de){ mesaj("❌ "+de.message,"#ff5555"); document.getElementById("btn").disabled=false; return; }

  mesaj("✅ Eklendi: "+title, "#28ff63");
  document.getElementById("title").value = "";
  document.getElementById("btn").disabled = false;

  /* label sıfırla */
  const label = document.getElementById("fileLabel");
  label.innerHTML = '📁 Dosya Seç<input type="file" id="file" accept="audio/*">';
  label.classList.remove("secildi");
  label.querySelector("input").addEventListener("change", dosyaDinle);

  listele();
});

function dosyaDinle(){
  const label = document.getElementById("fileLabel");
  const inp   = label.querySelector("input");
  if(!inp) return;
  inp.addEventListener("change", function(){
    if(this.files.length){
      const kisa = this.files[0].name.length>25
        ? this.files[0].name.substring(0,25)+"..."
        : this.files[0].name;
      label.innerHTML = "✅ "+kisa+'<input type="file" id="file" accept="audio/*">';
      label.classList.add("secildi");
      dosyaDinle();
    }
  });
}

/* ===== LİSTE ===== */
async function listele(){
  const { data, error } = await supa.from("songs").select("*").order("id");
  if(error){ console.error(error); return; }

  document.getElementById("listBaslik").innerText =
    "📋 Şarkı Listesi (" + data.length + " parça)";

  if(!data.length){
    document.getElementById("liste").innerHTML =
      '<div class="bos-mesaj">Henüz şarkı yok</div>'; return;
  }

  document.getElementById("liste").innerHTML = data.map(s => {
    const ic = s.type==="jingle"?"🔔": s.type==="anons"?"📢":"🎵";
    return `<div class="satir">
      <span>${ic} ${s.title}</span>
      <button class="sil-btn" onclick="sarkiSil(${s.id}, this)">SİL</button>
    </div>`;
  }).join("");
}

/* ===== ŞARKI SİL ===== */
async function sarkiSil(id, btn){
  btn.disabled    = true;
  btn.innerText   = "...";
  const { error } = await supa.from("songs").delete().eq("id", id);
  if(error){
    alert("Silinemedi: " + error.message);
    btn.disabled  = false;
    btn.innerText = "SİL";
    return;
  }
  listele();
}

/* ===== İSTEKLER ===== */
async function istekleriGetir(){
  const { data, error } = await supa
    .from("requests").select("*")
    .order("created_at",{ ascending:false });
  if(error){ console.error(error); return; }

  if(!data.length){
    document.getElementById("istekler").innerHTML =
      '<div class="bos-mesaj">Henüz istek yok</div>'; return;
  }

  document.getElementById("istekler").innerHTML = data.map(r =>
    `<div class="satir">
      <span><b>${r.name}</b>: ${r.message}</span>
      <button class="sil-btn" onclick="istekSil(${r.id}, this)">SİL</button>
    </div>`
  ).join("");
}

async function istekSil(id, btn){
  btn.disabled  = true;
  btn.innerText = "...";
  const { error } = await supa.from("requests").delete().eq("id", id);
  if(error){ alert("Silinemedi: "+error.message); btn.disabled=false; btn.innerText="SİL"; return; }
  istekleriGetir();
}

/* ===== BAŞLAT ===== */
setInterval(istekleriGetir, 10000);
setInterval(()=>{
  const t = Number(localStorage.getItem(GIRIS_KEY));
  if(t && Date.now()-t >= OTURUM_MS) otomatikCikis();
}, 30000);

kontrolEt();
</script>
</body>
</html>
