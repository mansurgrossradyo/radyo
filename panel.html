<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radyo Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  text-align: center;
  padding: 40px;
}

input, select, button {
  padding: 10px;
  margin: 8px;
  font-size: 16px;
}

button {
  background: #28a745;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.sil {
  background: #dc3545;
  padding: 6px 12px;
}

#panelContainer{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  margin-top: 40px;
  max-width: 1200px;
  margin-left: auto;
  margin-right: auto;
}

.scrollBox{
  background: #181818;
  padding: 15px;
  border-radius: 10px;
  max-height: 500px;
  overflow-y: auto;
}

.satir {
  background: #222;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#loginBox{
  max-width:400px;
  margin:100px auto;
  background:#1b1b1b;
  padding:30px;
  border-radius:10px;
}

/* ======= PREMIUM ÜST PANEL ======= */
body{
  background: radial-gradient(circle at top, #1a1a1a 0%, #0b0b0b 55%, #000 100%);
  padding: 30px 20px 50px;
}

.panel-top{
  max-width: 1100px;
  margin: 0 auto 30px;
}

.panel-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 18px;
  text-align: left;
}

.panel-badge{
  display: inline-block;
  font-size: 11px;
  letter-spacing: 2px;
  color: #111;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  padding: 5px 10px;
  border-radius: 999px;
  font-weight: 800;
  margin-bottom: 8px;
}

.panel-title h1{
  margin: 0;
  font-size: 34px;
  letter-spacing: 1px;
}

.panel-title p{
  margin: 6px 0 0;
  color: rgba(255,255,255,.45);
  font-size: 14px;
}

.cikis-btn{
  background: linear-gradient(135deg, #ff416c, #ff4b2b) !important;
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(255,65,108,.25);
}

.upload-card{
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
  backdrop-filter: blur(10px);
}

.upload-title{
  text-align: left;
  font-size: 16px;
  font-weight: 700;
  color: #ffd200;
  margin-bottom: 14px;
  letter-spacing: .5px;
}

.upload-row{
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  align-items: center;
}

.upload-card input[type="text"],
.upload-card select{
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  color: #fff;
  border-radius: 14px;
  outline: none;
  min-width: 150px;
  transition: .25s ease;
}

.upload-card input[type="text"]:focus,
.upload-card select:focus{
  border-color: rgba(255,210,0,.6);
  box-shadow: 0 0 0 3px rgba(255,210,0,.12);
}

.upload-card select option{
  background: #1b1b1b;
  color: #fff;
}

.file-label{
  background: rgba(255,255,255,.08);
  border: 1px dashed rgba(255,255,255,.25);
  color: #fff;
  border-radius: 14px;
  padding: 12px 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: .25s ease;
}

.file-label:hover{
  border-color: #ffd200;
  background: rgba(255,210,0,.08);
}

.file-label input{
  display: none;
}

#btn{
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #111;
  border: none;
  border-radius: 14px;
  padding: 12px 28px;
  font-weight: 800;
  letter-spacing: 1px;
  box-shadow: 0 8px 24px rgba(255,200,0,.25);
  transition: .25s ease;
}

#btn:hover{
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 12px 30px rgba(255,200,0,.35);
}

#msg{
  margin-top: 14px;
  min-height: 22px;
  font-weight: 600;
}

/* mobil */
@media(max-width:700px){
  .panel-header{
    flex-direction: column;
    text-align: center;
  }
  .panel-title{
    text-align: center;
  }
  .upload-card input[type="text"],
  .upload-card select,
  .file-label,
  #btn{
    width: 100%;
  }
}
  
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" style="display:none;">
  <h2>🔐 Panel Giriş</h2>
  <input type="email" id="email" placeholder="Email"><br>
  <input type="password" id="password" placeholder="Şifre"><br>
  <button onclick="girisYap()">Giriş Yap</button>
  <p id="loginMsg"></p>
</div>

<!-- PANEL -->
<div id="panelContent" style="display:none;">

<div class="panel-top">
  <div class="panel-header">
    <div class="panel-title">
      <div class="panel-badge">LIVE ADMIN</div>
      <h1>🎛 RADYO PANEL</h1>
      <p>Şarkı yükle · Jingle ekle · İstekleri yönet</p>
    </div>
    <button class="cikis-btn" onclick="cikisYap()">Çıkış</button>
  </div>

  <div class="upload-card">
    <div class="upload-title">⬆ Yeni Parça Yükle</div>
    <div class="upload-row">
      <input type="text" id="title" placeholder="Şarkı adı (boşsa dosya adı)">
      <select id="type">
        <option value="music">🎵 Müzik</option>
        <option value="jingle">🔔 Jingle</option>
        <option value="anons">📢 Anons</option>
      </select>
      <label class="file-label">
        <span class="file-label-text">📁 Dosya Seç</span>
        <input type="file" id="file" accept="audio/*">
      </label>
      <button id="btn">YÜKLE</button>
    </div>
    <p id="msg"></p>
  </div>
</div>

<div id="panelContainer">

  <div>
    <h2>🎵 Gelen İstekler</h2>
    <div id="istekler" class="scrollBox"></div>
  </div>

  <div>
    <h2 id="sarkilistesiBaslik">📋 Şarkı Listesi</h2>
    <div id="liste" class="scrollBox"></div>
  </div>

</div>

</div>

<script>
const PROJECT_URL = "https://xiidhsrcyjtcwcwbomga.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk";

const supa = supabase.createClient(PROJECT_URL, ANON_KEY);

/* ============ OTOMATİK ÇIKIŞ AYARI ============ */
const PANEL_OTURUM_DK = 60; // 60 dk sonra otomatik çıkış
const PANEL_OTURUM_MS = PANEL_OTURUM_DK * 60 * 1000;
const GIRIS_ZAMANI_KEY = "radyo_panel_giris_zamani";
let otoCikisZamani = null;
/* ============================================== */

/* ================= AUTH ================= */

async function kontrolEt(){

  const { data, error } = await supa.auth.getSession();

  if(error){
    console.error("Oturum hatası:", error);
    return;
  }

  if(data.session){

    let girisZamani = Number(localStorage.getItem(GIRIS_ZAMANI_KEY));

    if(!girisZamani){
      girisZamani = Date.now();
      localStorage.setItem(GIRIS_ZAMANI_KEY, girisZamani.toString());
    }

    // Süre dolmuşsa çık
    if(Date.now() - girisZamani >= PANEL_OTURUM_MS){
      await otomatikCikis();
      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panelContent").style.display = "block";

    listele();
    istekleriGetir();

    // Kalan süre sonunda otomatik çıkış
    clearTimeout(otoCikisZamani);
    const kalanSure = PANEL_OTURUM_MS - (Date.now() - girisZamani);
    otoCikisZamani = setTimeout(otomatikCikis, kalanSure);

  } else {
    clearTimeout(otoCikisZamani);
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("panelContent").style.display = "none";
  }
}

async function girisYap(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    document.getElementById("loginMsg").innerText = "Email ve şifre yazın";
    return;
  }

  const { error } = await supa.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    document.getElementById("loginMsg").innerText = "Email veya şifre hatalı";
    return;
  }

  localStorage.setItem(GIRIS_ZAMANI_KEY, Date.now().toString());
  document.getElementById("loginMsg").innerText = "";

  kontrolEt();
}

/* ✅ ÇIKIŞ BUTONU (eksikti, eklendi) */
async function cikisYap(){
  clearTimeout(otoCikisZamani);
  localStorage.removeItem(GIRIS_ZAMANI_KEY);
  await supa.auth.signOut();
  kontrolEt();
}

async function otomatikCikis(){
  clearTimeout(otoCikisZamani);
  localStorage.removeItem(GIRIS_ZAMANI_KEY);
  await supa.auth.signOut();

  document.getElementById("panelContent").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("loginMsg").innerText =
    "⏰ Güvenlik nedeniyle oturum kapatıldı. Tekrar giriş yapın.";
}

/* ================= ŞARKI YÜKLE ================= */

/* === DOSYA SEÇİNDE OTOMATİK BAŞLIK === */
document.getElementById("file").addEventListener("change", function(){
  const dosya = this.files[0];
  if(!dosya) return;

  const titleInput = document.getElementById("title");

  // Sadece input boşsa otomatik doldur
  let ad = dosya.name
    .replace(/\.[^/.]+$/, "")   // uzantı kaldır
    .replace(/_/g, " ")          // alt çizgi → boşluk
    .replace(/-/g, " - ");       // tire düzelt

  titleInput.value = ad;
  titleInput.focus();

  // Dosya label güncelle
  document.querySelector(".file-label-text").innerText = "✅ " + dosya.name;
});

/* === YÜKLE BUTONU === */
document.getElementById("btn").addEventListener("click", async () => {

  const fileInput = document.getElementById("file");
  const type = document.getElementById("type").value;
  const titleInput = document.getElementById("title").value.trim();
  const msg = document.getElementById("msg");

  if (!fileInput.files.length) {
    mesajGoster("⚠ Önce dosya seç!", "#ff5555");
    return;
  }

  const file = fileInput.files[0];
  const title = titleInput === "" ? file.name.replace(/\.[^/.]+$/, "") : titleInput;

  // Aynı şarkı var mı?
  const { data: mevcut } = await supa
    .from("songs")
    .select("id")
    .ilike("title", title);

  if (mevcut && mevcut.length > 0) {
    mesajGoster("⚠ Bu şarkı zaten ekli!", "#ff5555");
    return;
  }

  mesajGoster("⏳ Yükleniyor...", "#fff");

  const filePath = "uploads/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.]/g, "_");

  const { error: uploadError } = await supa.storage
    .from("radyo")
    .upload(filePath, file, { upsert: true });

  if (uploadError) {
    mesajGoster("❌ Storage hatası: " + uploadError.message, "#ff5555");
    return;
  }

  const { data } = supa.storage.from("radyo").getPublicUrl(filePath);

  const { error: dbError } = await supa.from("songs").insert({
    title,
    url: data.publicUrl,
    type
  });

  if (dbError) {
    mesajGoster("❌ DB hatası: " + dbError.message, "#ff5555");
    return;
  }

  mesajGoster("✅ Eklendi: " + title, "#28ff63");

  // Temizle
  document.getElementById("title").value = "";
  document.getElementById("file").value = "";
  document.querySelector(".file-label-text").innerText = "📁 Dosya Seç";

  listele();
});

/* === MESAJ: 3 SANİYE SONRA KAYBOL === */
let mesajZamani = null;
function mesajGoster(metin, renk){
  const msg = document.getElementById("msg");
  msg.innerText = metin;
  msg.style.color = renk;

  clearTimeout(mesajZamani);
  mesajZamani = setTimeout(() => {
    msg.innerText = "";
  }, 3000); // 3 saniye sonra kaybol
}

/* ================= ŞARKI LİSTE ================= */

async function listele() {
  const { data } = await supa.from("songs").select("*").order("id");

  const toplam = data.length;
  document.getElementById("sarkilistesiBaslik").innerText =
    "📋 Şarkı Listesi (" + toplam + " parça)";

  let html = "";

  data.forEach(s => {
    const icon = s.type === "music" ? "🎵" :
                 s.type === "jingle" ? "🔔" : "📢";

    html += `
      <div class="satir">
        <span>${icon} ${s.title}</span>
        <button class="sil" onclick="sil(${s.id})">SİL</button>
      </div>
    `;
  });

  document.getElementById("liste").innerHTML = html;
}

async function sil(id){
  await supa.from("songs").delete().eq("id", id);
  listele();
}

/* ================= İSTEKLER ================= */

async function istekleriGetir(){
  const { data } = await supa.from("requests").select("*").order("created_at",{ascending:false});

  let html = "";

  data.forEach(r=>{
    html += `
      <div class="satir">
        <span><b>${r.name}</b>: ${r.message}</span>
        <button class="sil" onclick="istekSil(${r.id})">SİL</button>
      </div>
    `;
  });

  document.getElementById("istekler").innerHTML = html;
}

async function istekSil(id){
  await supa.from("requests").delete().eq("id", id);
  istekleriGetir();
}

/* ================= BAŞLAT ================= */

setInterval(istekleriGetir, 10000);

// 30 sn'de bir oturum süresini kontrol et
setInterval(() => {
  const girisZamani = Number(localStorage.getItem(GIRIS_ZAMANI_KEY));
  if (girisZamani && Date.now() - girisZamani >= PANEL_OTURUM_MS) {
    otomatikCikis();
  }
}, 30000);

kontrolEt();
</script>

</body>
</html>
