<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radyo Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  text-align: center;
  padding: 40px;
}
input, select, button {
  padding: 10px;
  margin: 8px;
  font-size: 16px;
}
button {
  background: #28a745;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
#liste {
  margin-top: 40px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}
.satir {
  background: #222;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sil {
  background: #dc3545;
  padding: 6px 12px;
}
</style>
</head>

<body>

<h1>🎛 RADYO PANEL</h1>

<input type="text" id="title" placeholder="Şarkı adı (boşsa dosya adı)">
<select id="type">
  <option value="music">Müzik</option>
  <option value="jingle">Jingle</option>
  <option value="anons">Anons</option>
</select>
<input type="file" id="file" accept="audio/*">
<br>
<button id="btn">YÜKLE</button>
<p id="msg"></p>

<div id="liste"></div>

<h2>🎵 Gelen İstekler</h2>
<div id="istekler"></div>
  
<script>
const PROJECT_URL = "https://xiidhsrcyjtcwcwbomga.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk";

const supa = supabase.createClient(PROJECT_URL, ANON_KEY);

document.getElementById("btn").addEventListener("click", async () => {

  const fileInput = document.getElementById("file");
  const type = document.getElementById("type").value;
  const titleInput = document.getElementById("title").value.trim();

  if (!fileInput.files.length) {
    alert("Dosya seç");
    return;
  }

  const file = fileInput.files[0];

  // Eğer title boşsa dosya adını kullan
  const title = titleInput === "" 
    ? file.name.replace(".mp3", "") 
    : titleInput;

  document.getElementById("msg").innerText = "Yükleniyor...";

  const filePath = "uploads/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.]/g, "_");

  const { error: uploadError } = await supa.storage
    .from("radyo")
    .upload(filePath, file, { upsert: true });

  if (uploadError) {
    console.error(uploadError);
    alert("Storage hatası: " + uploadError.message);
    document.getElementById("msg").innerText = "";
    return;
  }

  const { data } = supa.storage.from("radyo").getPublicUrl(filePath);

  const { error: dbError } = await supa
    .from("songs")
    .insert({ title: title, url: data.publicUrl, type: type });

  if (dbError) {
    console.error(dbError);
    alert("DB hatası: " + dbError.message);
    document.getElementById("msg").innerText = "";
    return;
  }

  document.getElementById("msg").innerText = "";
  document.getElementById("title").value = "";
  document.getElementById("file").value = "";

  alert("✅ Yüklendi");
  listele();
});

async function listele() {
  const { data, error } = await supa.from("songs").select("*").order("id");

  if (error) {
    console.error(error);
    return;
  }

  let html = "<h3>📋 Yüklü Dosyalar</h3>";

  if (!data.length) {
    html += "<p>Henüz dosya yok</p>";
  }

  data.forEach(s => {
    const icon = s.type === "music" ? "🎵" :
                 s.type === "jingle" ? "🔔" : "📢";

    html += `
      <div class="satir">
        <span>${icon} ${s.title}</span>
        <button class="sil" onclick="sil(${s.id})">SİL</button>
      </div>
    `;
  });

  document.getElementById("liste").innerHTML = html;
}

async function sil(id) {
  if (!confirm("Silinsin mi?")) return;

  const { error } = await supa.from("songs").delete().eq("id", id);

  if (error) {
    alert("Silme hatası: " + error.message);
    return;
  }

  listele();
}

listele();
// ==========================
// 🎵 İSTEKLERİ GETİR
// ==========================

async function istekleriGetir(){

  const { data, error } = await supa
    .from("requests")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    console.error("İstek hatası:", error);
    return;
  }

  let html = "";

  if(data.length === 0){
    html = "<p>Henüz istek yok</p>";
  } else {
    data.forEach(r=>{
      html += `
        <div class="satir">
          <span><b>${r.name}</b>: ${r.message}</span>
        </div>
      `;
    });
  }

  document.getElementById("istekler").innerHTML = html;
}

// Sayfa açılınca yükle
istekleriGetir();

// 10 saniyede bir yenile
setInterval(istekleriGetir, 10000);
</script>

</body>
</html>
