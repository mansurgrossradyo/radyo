<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radyo Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  text-align: center;
  padding: 40px;
}

input, select, button {
  padding: 10px;
  margin: 8px;
  font-size: 16px;
}

button {
  background: #28a745;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.sil {
  background: #dc3545;
  padding: 6px 12px;
}

/* === PANEL GRID === */
#panelContainer{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  margin-top: 40px;
  max-width: 1200px;
  margin-left: auto;
  margin-right: auto;
}

.scrollBox{
  background: #181818;
  padding: 15px;
  border-radius: 10px;
  max-height: 500px;
  overflow-y: auto;
}

.satir {
  background: #222;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* LOGIN */
#loginBox{
  max-width:400px;
  margin:100px auto;
  background:#1b1b1b;
  padding:30px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" style="display:none;">
  <h2>🔐 Panel Giriş</h2>
  <input type="email" id="email" placeholder="Email"><br>
  <input type="password" id="password" placeholder="Şifre"><br>
  <button onclick="girisYap()">Giriş Yap</button>
  <p id="loginMsg"></p>
</div>

<!-- PANEL -->
<div id="panelContent" style="display:none;">

<h1>🎛 RADYO PANEL 
  <button onclick="cikisYap()" style="background:#dc3545;">Çıkış</button>
</h1>

<input type="text" id="title" placeholder="Şarkı adı (boşsa dosya adı)">
<select id="type">
  <option value="music">Müzik</option>
  <option value="jingle">Jingle</option>
  <option value="anons">Anons</option>
</select>
<input type="file" id="file" accept="audio/*">
<br>
<button id="btn">YÜKLE</button>
<p id="msg"></p>

<div id="panelContainer">

  <div>
    <h2>🎵 Gelen İstekler</h2>
    <div id="istekler" class="scrollBox"></div>
  </div>

  <div>
    <h2>📋 Şarkı Listesi</h2>
    <div id="liste" class="scrollBox"></div>
  </div>

</div>

</div>

<script>
const PROJECT_URL = "https://xiidhsrcyjtcwcwbomga.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk";

const supa = supabase.createClient(PROJECT_URL, ANON_KEY);

/* ================= OTOMATİK ÇIKIŞ ================= */

const PANEL_OTURUM_DK = 60; // 60 dakika sonra çıkış
const PANEL_OTURUM_MS = PANEL_OTURUM_DK * 60 * 1000;
const GIRIS_ZAMANI_KEY = "radyo_panel_giris_zamani";

let otoCikisZamani = null;

/* ================= AUTH + OTOMATİK ÇIKIŞ ================= */

async function kontrolEt(){

  const { data, error } = await supa.auth.getSession();

  if(error){
    console.error("Oturum hatası:", error);
    return;
  }

  if(data.session){

    let girisZamani = Number(
      localStorage.getItem(GIRIS_ZAMANI_KEY)
    );

    // Eski oturum varsa süreyi şimdi başlat
    if(!girisZamani){
      girisZamani = Date.now();
      localStorage.setItem(
        GIRIS_ZAMANI_KEY,
        girisZamani.toString()
      );
    }

    // Süre dolmuşsa çıkış yap
    if(Date.now() - girisZamani >= PANEL_OTURUM_MS){
      await otomatikCikis();
      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panelContent").style.display = "block";

    listele();
    istekleriGetir();

    // Kalan süre kadar sonra otomatik çıkış
    clearTimeout(otoCikisZamani);

    const kalanSure =
      PANEL_OTURUM_MS - (Date.now() - girisZamani);

    otoCikisZamani = setTimeout(
      otomatikCikis,
      kalanSure
    );

  }else{

    clearTimeout(otoCikisZamani);

    document.getElementById("loginBox").style.display = "block";
    document.getElementById("panelContent").style.display = "none";
  }
}


async function girisYap(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    document.getElementById("loginMsg").innerText =
      "Email ve şifre yazın";
    return;
  }

  const { error } = await supa.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    document.getElementById("loginMsg").innerText =
      "Email veya şifre hatalı";
    return;
  }

  // Giriş zamanını kaydet
  localStorage.setItem(
    GIRIS_ZAMANI_KEY,
    Date.now().toString()
  );

  document.getElementById("loginMsg").innerText = "";

setInterval(istekleriGetir, 10000);

// Otomatik çıkış kontrolü
setInterval(() => {

  const girisZamani = Number(
    localStorage.getItem(GIRIS_ZAMANI_KEY)
  );

  if(
    girisZamani &&
    Date.now() - girisZamani >= PANEL_OTURUM_MS
  ){
    otomatikCikis();
  }

}, 30000);

kontrolEt();
  
  kontrolEt();
}

async function otomatikCikis(){

  clearTimeout(otoCikisZamani);

  localStorage.removeItem(GIRIS_ZAMANI_KEY);

  await supa.auth.signOut();

  document.getElementById("panelContent").style.display = "none";
  document.getElementById("loginBox").style.display = "block";

  document.getElementById("loginMsg").innerText =
    "⏰ Güvenlik nedeniyle oturum kapatıldı. Tekrar giriş yapın.";
}

/* ================= ŞARKI YÜKLE ================= */

document.getElementById("btn").addEventListener("click", async () => {

  const fileInput = document.getElementById("file");
  const type = document.getElementById("type").value;
  const titleInput = document.getElementById("title").value.trim();

  if (!fileInput.files.length) {
    alert("Dosya seç");
    return;
  }

  const file = fileInput.files[0];
  const title = titleInput === "" ? file.name.replace(".mp3","") : titleInput;

  const filePath = "uploads/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.]/g, "_");

  const { error: uploadError } = await supa.storage
    .from("radyo")
    .upload(filePath, file, { upsert: true });

  if (uploadError) {
    alert("Storage hatası");
    return;
  }

    const { data } = supa.storage.from("radyo").getPublicUrl(filePath);

// 🔎 Aynı şarkı var mı kontrol et
const { data: mevcut } = await supa
  .from("songs")
  .select("id")
  .ilike("title", title);

if (mevcut && mevcut.length > 0) {
  alert("⚠ Bu şarkı zaten ekli!");
  return;
}

// ✅ Yoksa ekle
await supa.from("songs").insert({
  title,
  url: data.publicUrl,
  type
});

  alert("✅ Yüklendi");
  listele();
});

/* ================= ŞARKI LİSTE ================= */

async function listele() {
  const { data } = await supa.from("songs").select("*").order("id");

  let html = "";

  data.forEach(s => {
    const icon = s.type === "music" ? "🎵" :
                 s.type === "jingle" ? "🔔" : "📢";

    html += `
      <div class="satir">
        <span>${icon} ${s.title}</span>
        <button class="sil" onclick="sil(${s.id})">SİL</button>
      </div>
    `;
  });

  document.getElementById("liste").innerHTML = html;
}

async function sil(id){
  await supa.from("songs").delete().eq("id", id);
  listele();
}

/* ================= İSTEKLER ================= */

async function istekleriGetir(){
  const { data } = await supa.from("requests").select("*").order("created_at",{ascending:false});

  let html = "";

  data.forEach(r=>{
    html += `
      <div class="satir">
        <span><b>${r.name}</b>: ${r.message}</span>
        <button class="sil" onclick="istekSil(${r.id})">SİL</button>
      </div>
    `;
  });

  document.getElementById("istekler").innerHTML = html;
}

async function istekSil(id){
  await supa.from("requests").delete().eq("id", id);
  istekleriGetir();
}

setInterval(istekleriGetir, 10000);

kontrolEt();
</script>

</body>
</html>
