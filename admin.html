<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radyo Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:40px}
input,select,button{padding:10px;margin:10px;font-size:16px}
button{cursor:pointer}
#liste{margin-top:30px}
</style>
</head>
<body>

<h1>🎛 RADYO ADMIN PANEL</h1>

<input type="text" id="title" placeholder="Şarkı / Anons Adı">
<select id="type">
  <option value="music">Müzik</option>
  <option value="jingle">Jingle</option>
  <option value="anons">Anons</option>
</select>
<input type="file" id="file">
<br>
<button onclick="upload()">Yükle</button>

<div id="liste"></div>

<script>
const supabase = window.supabase.createClient(
  "https://xiidhsrcyjtcwcwbomga.supabase.co/rest/v1/",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk"
);

async function upload(){
  const file = document.getElementById("file").files[0];
  const title = document.getElementById("title").value;
  const type = document.getElementById("type").value;

  if(!file || !title) return alert("Alanları doldur");

  const filePath = Date.now() + "_" + file.name;

  const { data, error } = await supabase
    .storage
    .from("radyo")
    .upload(filePath, file);

  if(error){
    alert("Yükleme hatası");
    return;
  }

  const { data: publicUrl } = supabase
    .storage
    .from("radyo")
    .getPublicUrl(filePath);

  await supabase.from("songs").insert([
    {
      title: title,
      url: publicUrl.publicUrl,
      type: type
    }
  ]);

  alert("Yüklendi ✅");
  loadSongs();
}

async function loadSongs(){
  const { data } = await supabase.from("songs").select("*");

  let html = "<h3>Yüklü Dosyalar</h3>";
  data.forEach(s=>{
    html += `<div>${s.title} (${s.type})</div>`;
  });

  document.getElementById("liste").innerHTML = html;
}

loadSongs();
</script>

</body>
</html>
