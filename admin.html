<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radyo Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial;
  background:#111;
  color:#fff;
  text-align:center;
  padding:40px;
}
input,select,button{
  padding:10px;
  margin:10px;
  font-size:16px;
}
button{cursor:pointer}
</style>
</head>
<body>

<h1>🎛 RADYO ADMIN PANEL</h1>

<input type="text" id="title" placeholder="Şarkı / Anons Adı">
<select id="type">
  <option value="music">Müzik</option>
  <option value="jingle">Jingle</option>
  <option value="anons">Anons</option>
</select>

<input type="file" id="file">
<br>
<button id="uploadBtn">Yükle</button>

<script>
const { createClient } = supabase;

const client = createClient(
  "https://xiidhsrcyjtcwcwbomga.supabase.co/rest/v1/",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk"
);

document.getElementById("uploadBtn").addEventListener("click", async () => {

  const fileInput = document.getElementById("file");
  const title = document.getElementById("title").value;
  const type = document.getElementById("type").value;

  if (!fileInput.files.length || !title) {
    alert("Dosya ve isim gerekli");
    return;
  }

  const file = fileInput.files[0];
  const filePath = Date.now() + "_" + file.name;

  const { error: uploadError } = await client
    .storage
    .from("radyo")
    .upload(filePath, file);

  if (uploadError) {
    console.error(uploadError);
    alert("Yükleme hatası");
    return;
  }

  const { data } = client
    .storage
    .from("radyo")
    .getPublicUrl(filePath);

  const { error: insertError } = await client
    .from("songs")
    .insert([
      {
        title: title,
        url: data.publicUrl,
        type: type
      }
    ]);

  if (insertError) {
    console.error(insertError);
    alert("Veritabanı hatası");
    return;
  }

  alert("✅ Başarıyla yüklendi");
});
</script>

</body>
</html>
