<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Radyo Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:40px}
    input,select,button{padding:10px;margin:10px;font-size:16px}
    button{cursor:pointer}
  </style>
</head>
<body>

<h1>🎛 RADYO ADMIN PANEL</h1>

<input type="text" id="title" placeholder="Şarkı / Anons Adı" />
<select id="type">
  <option value="music">Müzik</option>
  <option value="jingle">Jingle</option>
  <option value="anons">Anons</option>
</select>

<input type="file" id="file" accept="audio/*" />
<br>

<button id="uploadBtn">Yükle</button>

<div id="status" style="margin-top:20px;"></div>

<script>
  // IMPORTANT: Bunları kendi değerlerinle değiştir
  const SUPABASE_URL = "https://xiidhsrcyjtcwcwbomga.supabase.co/rest/v1/";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaWRoc3JjeWp0Y3djd2JvbWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk5ODgsImV4cCI6MjEwMDQ3NTk4OH0.HZGLnrC5zCJAGVdvM6utFvyr0c_0eoyQ9ZxvstPYpuk";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById("uploadBtn").addEventListener("click", async () => {
    const title = document.getElementById("title").value.trim();
    const type = document.getElementById("type").value;
    const file = document.getElementById("file").files[0];

    if (!title) return alert("Başlık boş olamaz");
    if (!file) return alert("Dosya seçmedin");

    // Storage bucket: radyo
    const filePath = `radio_${Date.now()}_${file.name}`;

    // 1) Storage'a yükle
    const { error: uploadError } = await supabase
      .storage
      .from("radyo")
      .upload(filePath, file);

    if (uploadError) {
      console.error(uploadError);
      alert("Storage yükleme hatası (Console'a bak)");
      return;
    }

    // 2) Public URL al
    const { data } = supabase
      .storage
      .from("radyo")
      .getPublicUrl(filePath);

    // v2'de publicUrl genelde data.publicUrl olarak gelir
    const publicUrl = data.publicUrl;

    // 3) songs tablosuna kayıt ekle
    const { error: insertError } = await supabase
      .from("songs")
      .insert({ title, url: publicUrl, type });

    if (insertError) {
      console.error(insertError);
      alert("Database insert hatası (Console'a bak)");
      return;
    }

    document.getElementById("status").innerText = "✅ Yüklendi: " + title;
  });
</script>

</body>
</html>
